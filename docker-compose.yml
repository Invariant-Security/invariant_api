# Sobe os 5 invariant_* juntos -- usado tanto em dev local quanto como
# stack de validação na própria VPS de produção (cada repo's deploy.yml
# roda `docker compose up -d --build --wait <service>` aqui). Sem
# `depends_on` entre nenhum serviço (mesmo padrão do monólito -- nenhum
# conecta eagerly no boot, db.connect()/os clients HTTP só são chamados
# por request).
#
# `expose` em vez de `ports` em todo lugar de propósito: a VPS já tem
# outros processos publicados em 5432/8000/8001 (confirmado empiricamente
# antes desta stack existir) -- sem porta de host, zero risco de colisão,
# mesmo padrão que docker-compose.prod.yml do monólito já usa (nginx-proxy
# + rede Docker interna, nunca porta publicada direto).
#
# `web`/`api` entram também na rede `vps-proxy` (externa) com
# `container_name` fixo (`invariant-next-web`/`invariant-next-api`, mesma
# convenção de todo container nessa rede compartilhada -- nomes de serviço
# genéricos tipo "api"/"web" colidiriam com outros projetos) para o
# nginx-proxy alcançá-los. Desde 29/08/2026 é o tráfego real de
# `invariantsec.org` (corte feito, monólito antigo desligado) -- `postgres`/
# `assessment`/`ingestion` seguem só na rede interna.
#
# Rodar da raiz deste repo: docker compose up -d --build --wait
name: invariant-next

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: invariant
      POSTGRES_PASSWORD: invariant
      POSTGRES_DB: invariant
    volumes: ["pgdata:/var/lib/postgresql/data"]
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invariant"]
      interval: 10s
      timeout: 5s
      retries: 5

  assessment:
    build:
      context: ../invariant_assessment
    # collect_facts() faz `docker exec <alvo> ...` -- este container
    # precisa do socket do host pra alcançar os containers-alvo, do mesmo
    # jeito que o monólito's subprocess.run(["docker", "exec", ...]) já
    # fazia.
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ingestion:
    build:
      context: ../invariant_ingestion
    volumes: ["../../data/raw:/app/data/raw"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
    container_name: invariant-next-api
    environment:
      DATABASE_URL: postgresql://invariant:invariant@postgres:5432/invariant
      INVARIANT_ASSESSMENT_URL: http://assessment:8000
      INVARIANT_INGESTION_URL: http://ingestion:8000
      INVARIANT_API_CORS_ORIGINS: https://invariantsec.org
    volumes: ["../../data/demo:/app/data/demo:ro"]
    networks: ["default", "vps-proxy"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../invariant_frontend
      args:
        VITE_API_BASE: ""
    container_name: invariant-next-web
    networks: ["default", "vps-proxy"]
    expose: ["80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

networks:
  default: {}
  vps-proxy:
    external: true
