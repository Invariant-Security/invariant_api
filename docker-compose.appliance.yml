# Stack self-contained pro modo appliance -- diferente de docker-compose.yml
# (Strangler Fig na VPS, atrás do nginx-proxy externo + DNS), esta stack não
# depende de rede `vps-proxy` nenhuma nem de domínio: `web` publica direto
# na porta do host (INVARIANT_WEB_PORT), e o cliente acessa por IP. Usa
# `image:` em vez de `build:` -- as imagens já vêm publicadas por tag (ver
# .github/workflows/publish-images.yml), o instalador .deb não builda nada
# na máquina do cliente. Sem `depends_on`, mesma disciplina de
# docker-compose.yml/.dev.yml.
#
# Rodado pelo systemd unit que o .deb instala, OU direto pelo install.sh
# (ver invariant_packaging/) -- por isso todo serviço tem `restart:
# unless-stopped`: no canal install.sh não existe unit de systemd pra
# trazer o stack de volta depois de um reboot, só o próprio restart policy
# do Docker (cujo daemon já se auto-habilita no boot). Não é pra rodar
# direto num dev local, use docker-compose.dev.yml pra isso.
name: invariant-appliance

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: invariant
      POSTGRES_PASSWORD: invariant
      POSTGRES_DB: invariant
    volumes: ["pgdata_appliance:/var/lib/postgresql/data"]
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invariant"]
      interval: 10s
      timeout: 5s
      retries: 5

  assessment:
    image: ${INVARIANT_IMAGE_REGISTRY:-ghcr.io/invariant-security}/invariant-assessment:${INVARIANT_VERSION:-latest}
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ingestion:
    image: ${INVARIANT_IMAGE_REGISTRY:-ghcr.io/invariant-security}/invariant-ingestion:${INVARIANT_VERSION:-latest}
    restart: unless-stopped
    volumes: ["appliance_data_raw:/app/data/raw"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  discovery:
    image: ${INVARIANT_IMAGE_REGISTRY:-ghcr.io/invariant-security}/invariant-discovery:${INVARIANT_VERSION:-latest}
    restart: unless-stopped
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    image: ${INVARIANT_IMAGE_REGISTRY:-ghcr.io/invariant-security}/invariant-api:${INVARIANT_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://invariant:invariant@postgres:5432/invariant
      INVARIANT_ASSESSMENT_URL: http://assessment:8000
      INVARIANT_INGESTION_URL: http://ingestion:8000
      INVARIANT_DISCOVERY_URL: http://discovery:8000
      # Gerado pelo postinst do .deb em /etc/invariant/.env -- nunca
      # escolhido à mão (ver invariant_packaging/).
      INVARIANT_API_SECRET_KEY: ${INVARIANT_API_SECRET_KEY:?INVARIANT_API_SECRET_KEY must be set (generated by the .deb installer)}
      # Mesma origem que `web` serve -- ver nginx.appliance.conf, que
      # proxeia /api/ pro api container no mesmo host, então o browser
      # sempre fala com a mesma origem (http://<ip-do-appliance>/), nunca
      # cross-origin de verdade.
      INVARIANT_API_CORS_ORIGINS: http://localhost:${INVARIANT_WEB_PORT:-80},http://127.0.0.1:${INVARIANT_WEB_PORT:-80}
    volumes: ["appliance_data_demo:/app/data/demo"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ${INVARIANT_IMAGE_REGISTRY:-ghcr.io/invariant-security}/invariant-web:${INVARIANT_VERSION:-latest}
    restart: unless-stopped
    ports: ["${INVARIANT_WEB_PORT:-80}:80"]
    volumes:
      # Roteamento único (só a porta do web, sem porta de API separada
      # pro cliente lembrar) -- sobrescreve o nginx.conf baked na imagem
      # (que serve só estático) com uma versão que também proxeia /api/.
      # Volume mount, não rebuild de imagem -- reaproveita a imagem já
      # publicada sem variante nova.
      - ./nginx.appliance.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata_appliance:
  appliance_data_raw:
  appliance_data_demo:
