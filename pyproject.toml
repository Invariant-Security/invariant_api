[project]
name = "invariant_api"
version = "0.1.0"
description = "Control plane: the only invariant_* service that touches Postgres. Orchestrates invariant_assessment/invariant_ingestion over HTTP and serves the frontend."
requires-python = ">=3.11"
dependencies = [
    "invariant_contracts @ git+https://github.com/Invariant-Security/invariant_contracts.git@main",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "psycopg[binary]",
    "alembic",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx2"]

[tool.pytest.ini_options]
markers = [
    "integration: hits a real Postgres (DATABASE_URL) or the real assessment/ingestion services instead of mocks",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant_api"]

[tool.hatch.metadata]
# Needed because invariant_contracts is a direct git reference (@ git+...)
# above -- no private package registry exists yet (see invariant_contracts'
# own README for the "small increments" reasoning), hatchling requires
# explicit opt-in to allow that.
allow-direct-references = true
