# Sobrescreve o nginx.conf baked na imagem invariant-web (ver
# docker-compose.appliance.yml's volume mount) -- mesma base de
# invariant_frontend/nginx.conf, mais o bloco /api/ que faltava: no modo
# appliance o cliente só abre uma porta (INVARIANT_WEB_PORT), então o
# frontend precisa proxear as chamadas de API pro container `api` no
# mesmo compose network, em vez de bater numa porta separada.
server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Rotas de auth/endpoints não levam o prefixo /api/ (ver
  # invariant_api's routes/auth.py e routes/endpoints.py) -- proxeadas à
  # parte pra não precisar renomear rota nenhuma do lado do backend só por
  # causa do path do proxy.
  location /auth/ {
    proxy_pass http://api:8000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /endpoints {
    proxy_pass http://api:8000/endpoints;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:svg|ico|png|jpg|jpeg|webp|txt|xml)$ {
    expires 1d;
    add_header Cache-Control "public";
  }
}
