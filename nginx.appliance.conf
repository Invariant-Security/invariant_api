# Template do nginx do appliance (montado em /etc/nginx/templates/ pelo
# docker-compose.appliance.yml; o entrypoint da imagem nginx gera o
# conf.d/default.conf substituindo só variáveis INVARIANT_*, ver
# NGINX_ENVSUBST_FILTER no compose -- $host etc. ficam intactas).
#
# HTTPS obrigatório: a porta 80 só responde /healthz (healthcheck do
# compose) e redireciona todo o resto para HTTPS. Certificado em
# /etc/nginx/tls (= /etc/invariant/tls no host), gerado pelo provision.sh
# ou substituído pelo da empresa -- sem rebuild de imagem.
#
# Mesma base de invariant_frontend/nginx.conf, mais os blocos que
# proxeiam /api/ e /auth/ pro container `api` no mesmo compose network.
server {
  listen 80;
  listen [::]:80;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host:${INVARIANT_HTTPS_PORT}$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:5m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8000/;
    # Headers reservados à infraestrutura interna nunca atravessam a borda
    # (lista em src/invariant_api/edge_headers.py; conferida por teste).
    proxy_set_header X-Invariant-Gateway-Token "";
    proxy_set_header X-Invariant-Api-Key "";
    proxy_set_header X-Invariant-Api-Key-Id "";
    proxy_set_header X-Invariant-Principal "";
    proxy_set_header X-Invariant-Internal-Token "";
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Default (1m) 413s on POST /api/reports/pdf?kind=consolidated -- that
    # body bundles every selected container's full finding list (evidence +
    # remediation text included), ~950KB for just 4 containers in a real
    # batch. 20m matches the shared vps-proxy's own /api/ blocks
    # (infra/proxy/nginx.conf) for the same route.
    client_max_body_size 20m;
  }

  # /auth/ não leva o prefixo /api/ (ver invariant_api's routes/auth.py)
  # -- proxeada à parte pra não precisar renomear rota nenhuma do lado do
  # backend só por causa do path do proxy. Sem risco de colisão com uma
  # página do console (nenhuma delas navega pra /auth/*, só /setup e
  # /login, que são paths diferentes).
  #
  # IMPORTANTE: /endpoints, /containers e /assess/ NÃO ganham um location
  # bare como este -- essas 3 literais TAMBÉM são páginas do console
  # (window.location.pathname em App.jsx), então um location bare aqui
  # sequestra a navegação real do navegador (GET /endpoints da página)
  # pro mesmo path da API (GET /endpoints da lista), devolvendo JSON cru
  # em vez do app montar. O frontend por isso chama essas 3 sempre via
  # /api/ (endpoints.jsx, findings.jsx) -- só location /api/ resolve.
  location /auth/ {
    proxy_pass http://api:8000/auth/;
    # Headers reservados à infraestrutura interna nunca atravessam a borda
    # (lista em src/invariant_api/edge_headers.py; conferida por teste).
    proxy_set_header X-Invariant-Gateway-Token "";
    proxy_set_header X-Invariant-Api-Key "";
    proxy_set_header X-Invariant-Api-Key-Id "";
    proxy_set_header X-Invariant-Principal "";
    proxy_set_header X-Invariant-Internal-Token "";
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:svg|ico|png|jpg|jpeg|webp|txt|xml)$ {
    expires 1d;
    add_header Cache-Control "public";
  }
}
